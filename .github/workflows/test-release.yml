name: Test Pastoralist Release

on:
  # Triggered by repository dispatch from pastoralist repo on release
  repository_dispatch:
    types: [pastoralist-release]
  
  # Allow manual triggering for testing
  workflow_dispatch:
    inputs:
      pastoralist_version:
        description: 'Pastoralist version to test (optional, defaults to latest)'
        required: false
        type: string

jobs:
  test-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          # Update pastoralist to the released version
          if [ -n "${{ github.event.inputs.pastoralist_version }}" ]; then
            npm install pastoralist@${{ github.event.inputs.pastoralist_version }}
          elif [ -n "${{ github.event.client_payload.version }}" ]; then
            npm install pastoralist@${{ github.event.client_payload.version }}
          else
            npm install pastoralist@latest
          fi
          npm install
      
      - name: Display Pastoralist version
        run: |
          echo "Testing Pastoralist version:"
          npm list pastoralist
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Run E2E Tests
        run: |
          cd e2e
          ./run-tests.sh
        env:
          # Ensure Docker has enough resources
          DOCKER_BUILDKIT: 1
      
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: e2e/**/*.log
          retention-days: 7
      
      - name: Comment on release (if triggered by dispatch)
        if: github.event_name == 'repository_dispatch' && (success() || failure())
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅ PASSED' : '❌ FAILED';
            const version = '${{ github.event.client_payload.version }}' || 'latest';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            
            console.log(`E2E tests ${status} for Pastoralist v${version}`);
            console.log(`View details: ${runUrl}`);
            
            // If we have a release URL from the dispatch, we could comment on the release
            // This would require additional setup and tokens to comment on the pastoralist repo
