name: Test Pastoralist Update 🧑‍🌾

on:
  repository_dispatch:
    types: [pastoralist_update]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Get triggered version info
        run: |
          echo "🚀 Pastoralist update triggered!"
          echo "Triggered by: ${{ github.event.client_payload.triggered_by || 'unknown' }}"
          echo "Source ref: ${{ github.event.client_payload.source_ref || 'unknown' }}"
          echo "Event type: ${{ github.event.action }}"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
        env:
          CI: true

      - name: Run pastoralist-specific tests
        run: |
          echo "🧪 Running pastoralist integration tests..."
          # Add your specific pastoralist testing commands here
          # For example:
          # npm run test:pastoralist
          # or install latest pastoralist and test it
          npx pastoralist --help